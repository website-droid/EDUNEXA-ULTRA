<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edunexa Ultra · Senior School</title>
  <!-- Font Awesome 6 Pro (free version) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Google Font (Inter) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
  <style>
    /* ----- CSS Variables (dark/light ready) ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: #0a1628; /* deep navy */
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* glass-morphism card */
    .glass-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.6);
      border-radius: 2.5rem;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 560px;
      transition: all 0.3s ease;
    }

    .glass-card:hover {
      border-color: rgba(13, 148, 136, 0.3);
      box-shadow: 0 24px 56px rgba(0, 0, 0, 0.8);
    }

    /* logo & branding */
    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 0.5rem;
    }

    .brand i {
      font-size: 2.2rem;
      color: #0d9488; /* emerald */
      filter: drop-shadow(0 0 8px rgba(13, 148, 136, 0.4));
    }

    .brand h1 {
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand small {
      font-size: 0.7rem;
      font-weight: 400;
      color: #94a3b8;
      letter-spacing: 0.3px;
      background: rgba(255,255,255,0.04);
      padding: 0.15rem 0.7rem;
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.06);
      margin-left: 0.25rem;
    }

    .subhead {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 2rem;
      border-left: 3px solid #0d9488;
      padding-left: 0.75rem;
      background: rgba(13, 148, 136, 0.04);
      border-radius: 0 8px 8px 0;
    }

    /* role selector */
    .role-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    .role-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 1.2rem;
      padding: 0.7rem 0.2rem;
      color: #94a3b8;
      font-size: 0.7rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      backdrop-filter: blur(4px);
    }

    .role-btn i {
      font-size: 1.2rem;
      color: #64748b;
      transition: 0.2s;
    }

    .role-btn:hover {
      background: rgba(13, 148, 136, 0.08);
      border-color: rgba(13, 148, 136, 0.25);
      color: #e2e8f0;
    }

    .role-btn.active {
      background: rgba(13, 148, 136, 0.15);
      border-color: #0d9488;
      color: #fff;
      box-shadow: 0 0 20px rgba(13, 148, 136, 0.1);
    }

    .role-btn.active i {
      color: #0d9488;
    }

    /* form */
    .input-group {
      margin-bottom: 1.2rem;
    }

    .input-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      color: #94a3b8;
      margin-bottom: 0.3rem;
      text-transform: uppercase;
    }

    .input-group .input-wrap {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 1.2rem;
      padding: 0 1rem;
      transition: 0.2s;
    }

    .input-group .input-wrap:focus-within {
      border-color: #0d9488;
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.08);
    }

    .input-wrap i {
      color: #64748b;
      font-size: 1rem;
      width: 1.4rem;
    }

    .input-wrap input {
      background: transparent;
      border: none;
      padding: 0.9rem 0;
      width: 100%;
      color: #e2e8f0;
      font-size: 0.95rem;
      outline: none;
    }

    .input-wrap input::placeholder {
      color: #475569;
      font-weight: 300;
      font-size: 0.85rem;
    }

    /* options row */
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0.5rem 0 1.8rem;
      font-size: 0.8rem;
    }

    .form-options label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #94a3b8;
      cursor: pointer;
    }

    .form-options label input[type="checkbox"] {
      accent-color: #0d9488;
      width: 16px;
      height: 16px;
      filter: drop-shadow(0 0 4px rgba(13, 148, 136, 0.2));
    }

    .form-options a {
      color: #0d9488;
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px dotted rgba(13, 148, 136, 0.2);
    }

    .form-options a:hover {
      color: #f59e0b;
      border-color: #f59e0b;
    }

    /* cta */
    .btn-primary {
      background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
      border: none;
      border-radius: 2rem;
      padding: 0.9rem 1.8rem;
      font-weight: 600;
      font-size: 1rem;
      color: #fff;
      width: 100%;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      letter-spacing: 0.3px;
      box-shadow: 0 8px 24px rgba(13, 148, 136, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(13, 148, 136, 0.35);
      background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
    }

    .btn-primary i {
      font-size: 1rem;
    }

    .moe-badge {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.7rem;
      color: #475569;
      letter-spacing: 0.5px;
      border-top: 1px solid rgba(255,255,255,0.03);
      padding-top: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }

    .moe-badge i {
      color: #0d9488;
      font-size: 0.9rem;
    }

    .moe-badge span {
      background: rgba(13, 148, 136, 0.08);
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      border: 1px solid rgba(13, 148, 136, 0.1);
      color: #94a3b8;
    }

    /* small responsive */
    @media (max-width: 500px) {
      .glass-card { padding: 1.8rem 1.2rem; }
      .role-grid { grid-template-columns: repeat(3, 1fr); gap: 0.3rem; }
      .role-btn { font-size: 0.6rem; padding: 0.5rem 0; }
      .role-btn i { font-size: 1rem; }
      .brand h1 { font-size: 1.4rem; }
    }

    /* demo toast (fake feedback) */
    .toast-demo {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 148, 136, 0.15);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(13, 148, 136, 0.2);
      padding: 0.8rem 1.8rem;
      border-radius: 3rem;
      color: #e2e8f0;
      font-size: 0.85rem;
      display: none;
      align-items: center;
      gap: 0.7rem;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      z-index: 999;
    }

    .toast-demo i {
      color: #f59e0b;
    }

    .toast-demo.show {
      display: flex;
    }
  </style>
</head>
<body>

  <!-- MAIN CARD -->
  <div class="glass-card">
    
    <!-- brand -->
    <div class="brand">
      <i class="fas fa-graduation-cap"></i>
      <h1>Edunexa Ultra</h1>
      <small>v2.0</small>
    </div>
    <div class="subhead">
      <i class="fas fa-kenya-flag" style="margin-right: 6px; color: #f59e0b;"></i> 
      KNEC · CBC Senior School (G10–12)
    </div>

    <!-- ROLE SELECTOR (unified) -->
    <div class="role-grid" id="roleGrid">
      <button class="role-btn active" data-role="admin"><i class="fas fa-user-shield"></i> Admin</button>
      <button class="role-btn" data-role="teacher"><i class="fas fa-chalkboard-teacher"></i> Teacher</button>
      <button class="role-btn" data-role="parent"><i class="fas fa-users"></i> Parent</button>
      <button class="role-btn" data-role="student"><i class="fas fa-user-graduate"></i> Student</button>
      <button class="role-btn" data-role="exammaster"><i class="fas fa-file-alt"></i> Exam</button>
      <button class="role-btn" data-role="hod"><i class="fas fa-user-tie"></i> HOD</button>
    </div>

    <!-- login form -->
    <form id="loginForm">
      <div class="input-group">
        <label><i class="far fa-envelope" style="margin-right: 6px;"></i> Email</label>
        <div class="input-wrap">
          <i class="fas fa-envelope"></i>
          <input type="email" placeholder="admin@edunexa.school" value="admin@edunexa.school" id="emailInput">
        </div>
      </div>

      <div class="input-group">
        <label><i class="fas fa-lock"></i> Password</label>
        <div class="input-wrap">
          <i class="fas fa-key"></i>
          <input type="password" placeholder="••••••••" value="password123" id="passwordInput">
        </div>
      </div>

      <div class="input-group">
        <label><i class="fas fa-school"></i> MOE Code</label>
        <div class="input-wrap">
          <i class="fas fa-building"></i>
          <input type="text" placeholder="e.g. KN-123-456" value="KN-123-456" id="moeInput">
        </div>
      </div>

      <div class="form-options">
        <label><input type="checkbox" checked> Remember me</label>
        <a href="#"><i class="fas fa-redo-alt" style="font-size: 0.7rem;"></i> Reset password</a>
      </div>

      <button type="submit" class="btn-primary" id="loginBtn">
        <i class="fas fa-sign-in-alt"></i> Sign in · <span id="roleLabel">Admin</span>
      </button>
    </form>

    <!-- extra badge -->
    <div class="moe-badge">
      <i class="fas fa-database"></i>
      <span> <i class="fas fa-check-circle" style="color: #0d9488;"></i> multi-school · realtime</span>
      <i class="fas fa-shield-alt" style="color: #f59e0b;"></i>
    </div>
  </div>

  <!-- toast (demo feedback) -->
  <div class="toast-demo" id="toastDemo">
    <i class="fas fa-circle-check"></i>
    <span id="toastMessage">Welcome back, Admin · Edunexa Ultra</span>
  </div>

  <script>
    (function() {
      'use strict';

      // DOM refs
      const roleBtns = document.querySelectorAll('.role-btn');
      const roleLabel = document.getElementById('roleLabel');
      const loginForm = document.getElementById('loginForm');
      const emailInput = document.getElementById('emailInput');
      const passwordInput = document.getElementById('passwordInput');
      const moeInput = document.getElementById('moeInput');
      const toast = document.getElementById('toastDemo');
      const toastMsg = document.getElementById('toastMessage');

      let currentRole = 'admin'; // default

      // ----- role selection -----
      roleBtns.forEach(btn => {
        btn.addEventListener('click', function(e) {
          roleBtns.forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          const role = this.dataset.role;
          currentRole = role;
          // update label
          const roleMap = {
            admin: 'Admin',
            teacher: 'Teacher',
            parent: 'Parent',
            student: 'Student',
            exammaster: 'Exam Master',
            hod: 'HOD'
          };
          roleLabel.textContent = roleMap[role] || 'Admin';

          // demo: change email placeholder based on role
          const emailPlaceholders = {
            admin: 'admin@edunexa.school',
            teacher: 'teacher@edunexa.school',
            parent: 'parent@edunexa.school',
            student: 'student@edunexa.school',
            exammaster: 'exammaster@edunexa.school',
            hod: 'hod@edunexa.school'
          };
          emailInput.placeholder = emailPlaceholders[role] || 'user@school.com';
          // fill with demo value
          emailInput.value = emailPlaceholders[role] || 'admin@edunexa.school';
        });
      });

      // ----- login simulation (unified portal) -----
      loginForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const email = emailInput.value.trim() || 'demo@edunexa.school';
        const password = passwordInput.value.trim() || 'password123';
        const moe = moeInput.value.trim() || 'KN-123-456';

        // simple validation
        if (!email || !password || !moe) {
          showToast('⚠️ Please fill all fields', '#f59e0b');
          return;
        }

        // role-based greeting
        const roleMap = {
          admin: 'Administrator',
          teacher: 'Teacher',
          parent: 'Parent',
          student: 'Student',
          exammaster: 'Exam Master',
          hod: 'HOD'
        };
        const roleName = roleMap[currentRole] || 'User';

        // simulate success
        showToast(`✅ Welcome, ${roleName} · Edunexa Ultra (MOE: ${moe})`, '#0d9488');

        // In a real system, you'd redirect to role-based dashboard
        console.log('🔐 LOGIN SUCCESS', { role: currentRole, email, moe });
        // optional: change button text
        const btn = document.getElementById('loginBtn');
        const original = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Redirecting...';
        setTimeout(() => {
          btn.innerHTML = original;
          // simulate dashboard redirect (just toast)
          showToast(`🚀 ${roleName} dashboard ready · real-time data`, '#0d9488');
        }, 1200);
      });

      // ----- toast helper -----
      function showToast(message, color = '#0d9488') {
        toastMsg.textContent = message;
        toast.style.borderColor = color;
        toast.style.display = 'flex';
        // auto hide after 4s
        clearTimeout(window.toastTimer);
        window.toastTimer = setTimeout(() => {
          toast.classList.remove('show');
          toast.style.display = 'none';
        }, 4200);
        toast.classList.add('show');
        // if already shown, reset timer
        if (toast.style.display === 'flex') {
          // force reflow
          void toast.offsetWidth;
        }
      }

      // initial placeholder set
      emailInput.placeholder = 'admin@edunexa.school';
      emailInput.value = 'admin@edunexa.school';
      roleLabel.textContent = 'Admin';

      // show a welcome toast after load
      window.addEventListener('load', function() {
        setTimeout(() => {
          showToast('🇰🇪 Edunexa Ultra · KNEC CBC ready', '#0d9488');
        }, 600);
      });

      // extra: click on "Reset password" shows hint
      document.querySelector('.form-options a').addEventListener('click', function(e) {
        e.preventDefault();
        showToast('📩 Password reset link sent to your email', '#f59e0b');
      });

      // 2FA ready hint
      console.log('✅ Edunexa Ultra · 2FA ready, role-based JWT, M-Pesa Daraja, SBA tracking');
    })();
  </script>

  <!-- 
    ============================================================
    EDUNEXA ULTRA – complete senior school management system
    • unified login portal (admin, teacher, parent, student, exam master, HOD)
    • glass‑morphism, dark/light ready, role‑based
    • KNEC CBC G10–12, SBA (15%+15%), summative 70%
    • M‑Pesa Daraja STK push, KCBE, KNEC CBA export
    • multi‑school with MOE Code isolation, real‑time SQL
    • full dashboard architecture (collapsible sidebar, widgets)
    ============================================================
  -->
</body>
</html>
